name: gffffff2m

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: 'GoFile URL to download'
        required: true
        default: 'https://gofile.io/d/xbD9Joj8'
      mf_folder:
        description: 'MediaFire destination folder'
        required: true
        default: '1/101126'
      mf_email:
        description: 'MediaFire email'
        required: true
        default: ''
      input_file:
        description: 'Downloaded file to upload or trim (e.g. match.ts)'
        required: true
      skip_trim:
        description: 'Skip FFmpeg trim and upload file as-is'
        required: false
        type: boolean
        default: false
      cut_start:
        description: 'FFmpeg -ss start time (e.g. 00:00:00) — ignored if skip_trim is checked'
        required: false
        default: '00:00:00'
      cut_end:
        description: 'FFmpeg -to end time (e.g. 02:00:00) — leave empty to cut to end of file'
        required: false
        default: ''
      output_file:
        description: 'Output filename after cut (e.g. match_part1.ts) — ignored if skip_trim is checked'
        required: false
        default: ''

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ── 1. Install exact yt-dlp version ────────────────────────────────────
      - name: Install yt-dlp
        run: pip install --force-reinstall "yt-dlp[default]==2026.06.09"

      # ── 2. Swap in the custom GoFile extractor ──────────────────────────────
      - name: Replace GoFile extractor
        run: |
          EXTRACTOR_DIR=$(python -c "
          import yt_dlp, os
          print(os.path.join(os.path.dirname(yt_dlp.__file__), 'extractor'))
          ")
          echo "→ Patching: $EXTRACTOR_DIR/gofile.py"
          rm -f "$EXTRACTOR_DIR/gofile.py"
          cp gofile.py "$EXTRACTOR_DIR/gofile.py"

      # ── 3. Download from GoFile ─────────────────────────────────────────────
      - name: Download from GoFile
        run: |
          yt-dlp -o "%(title)s.%(ext)s" "${{ inputs.gofile_url }}"
          echo "--- Files after download ---"
          ls -lh

      # ── 4. Cut with FFmpeg (skipped if skip_trim is checked) ────────────────
      - name: Cut file with FFmpeg
        if: ${{ inputs.skip_trim == false }}
        run: |
          if [[ ! -f "${{ inputs.input_file }}" ]]; then
            echo "ERROR: '${{ inputs.input_file }}' not found – available files:"
            ls -lh
            exit 1
          fi

          CUT_END="${{ inputs.cut_end }}"
          if [[ -n "$CUT_END" ]]; then
            echo "▶ Cutting: ${{ inputs.cut_start }} → $CUT_END"
            ffmpeg -i "${{ inputs.input_file }}" \
              -ss "${{ inputs.cut_start }}" \
              -to "$CUT_END" \
              -map 0 -c copy \
              "${{ inputs.output_file }}"
          else
            echo "▶ Cutting: ${{ inputs.cut_start }} → end of file"
            ffmpeg -i "${{ inputs.input_file }}" \
              -ss "${{ inputs.cut_start }}" \
              -map 0 -c copy \
              "${{ inputs.output_file }}"
          fi

          echo "--- Output file ---"
          ls -lh "${{ inputs.output_file }}"

      # ── 5. Set up MediaFire uploader ────────────────────────────────────────
      - name: Clone mfcmd.py uploader
        run: |
          git clone https://github.com/JayBrown/mfcmd.py---MediaFire-uploader
          cp mfcmd.py---MediaFire-uploader/mfcmd.py .

      # ── 6. Install mediafire & patch subsetio ───────────────────────────────
      - name: Install mediafire & patch subsetio
        run: |
          pip install mediafire
          python .github/scripts/patch_subsetio.py

      # ── 7. Upload to MediaFire ───────────────────────────────────────────────
      - name: Upload file to MediaFire
        env:
          MF_PASSWORD: ${{ secrets.MEDIAFIRE_PASSWORD }}
        run: |
          if [[ "${{ inputs.skip_trim }}" == "true" ]]; then
            UPLOAD_FILE="${{ inputs.input_file }}"
          else
            UPLOAD_FILE="${{ inputs.output_file }}"
          fi

          if [[ ! -f "$UPLOAD_FILE" ]]; then
            echo "ERROR: '$UPLOAD_FILE' not found"
            ls -lh
            exit 1
          fi

          echo "▶ Uploading: $UPLOAD_FILE"
          python mfcmd.py \
            -e "${{ inputs.mf_email }}" \
            -p "$MF_PASSWORD" \
            -u "${{ inputs.mf_folder }}" \
            -f "$UPLOAD_FILE"
